<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Land - Character</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e7e2; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

    .hud { position: fixed; left: 18px; top: 16px; color: #4a4640; user-select: none; pointer-events: none; }
    .hud h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
    .hud p  { margin: 4px 0 0; font-size: 12px; opacity: .65; }

    .bar {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: flex; gap: 4px; padding: 5px;
      background: rgba(255,255,255,.62); backdrop-filter: blur(8px);
      border-radius: 999px; box-shadow: 0 6px 22px rgba(0,0,0,.09);
    }
    .bar button {
      border: 0; background: transparent; color: #4a4640;
      font: inherit; font-size: 12px; font-weight: 550;
      padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    .bar button:hover { background: rgba(0,0,0,.06); }
    .bar button.active { background: #4a4640; color: #f3f1ec; }
    .bar .sep { width: 1px; background: rgba(0,0,0,.12); margin: 4px 3px; }

    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #6b665e; font-size: 13px; letter-spacing: .04em; background: #e9e7e2;
      transition: opacity .4s ease; z-index: 10;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div class="hud">
    <h1>English Land</h1>
    <p>Character design &middot; drag to orbit &middot; scroll to zoom</p>
  </div>

  <div class="bar">
    <button data-view="front">Front</button>
    <button data-view="back">Back</button>
    <button data-view="left">Left</button>
    <button data-view="right">Right</button>
    <button data-view="top">Top</button>
    <div class="sep"></div>
    <button data-spin class="active">Spin</button>
  </div>

  <div id="loading">loading&hellip;</div>

  <script src="lib/babylon.js"></script>
  <script src="js/character.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
