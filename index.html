<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Land</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6ef; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

    .hud { position: fixed; left: 18px; top: 16px; color: #2f4750; user-select: none; pointer-events: none; }
    .hud h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
    .hud p  { margin: 4px 0 0; font-size: 12px; opacity: .7; }
    .hud .state { font-variant-numeric: tabular-nums; opacity: .85; font-weight: 550; }

    .keys {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,.6); backdrop-filter: blur(8px);
      box-shadow: 0 6px 22px rgba(0,0,0,.08);
      color: #2f4750; font-size: 12px; user-select: none; pointer-events: none;
      white-space: nowrap;
    }
    .keys kbd {
      display: inline-block; min-width: 20px; padding: 3px 6px; margin: 0 1px;
      border-radius: 5px; background: #fff; border: 1px solid rgba(0,0,0,.14);
      border-bottom-width: 2px; font: inherit; font-size: 11px; font-weight: 600;
      text-align: center; color: #2f4750;
    }
    .keys .sep { width: 1px; height: 16px; background: rgba(0,0,0,.12); }

    /* second row, above the movement hints */
    .keys.emotes { bottom: 66px; gap: 14px; }
    .keys.emotes span { display: inline-flex; align-items: center; gap: 4px; }

    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #4a6570; font-size: 13px; letter-spacing: .04em; background: #cfe6ef;
      transition: opacity .4s ease; z-index: 10;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 560px) {
      .keys { font-size: 11px; gap: 7px; padding: 7px 10px; }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>

  <div class="hud">
    <h1>English Land</h1>
    <p><span class="state" id="speed">idle</span></p>
  </div>

  <div class="keys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span class="sep"></span>
    <span><kbd>Shift</kbd> run</span>
    <span class="sep"></span>
    <span><kbd>Space</kbd> jump</span>
    <span class="sep"></span>
    <span>drag to orbit</span>
  </div>

  <div class="keys emotes">
    <span><kbd>Z</kbd> wave</span>
    <span><kbd>X</kbd> thumbs up</span>
    <span><kbd>C</kbd> clap</span>
    <span><kbd>V</kbd> yes</span>
    <span><kbd>Q</kbd> no</span>
    <span><kbd>E</kbd> think</span>
  </div>

  <div id="loading">loading&hellip;</div>

  <script src="lib/babylon.js"></script>
  <script src="js/character.js"></script>
  <script src="js/props.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/world.js"></script>
  <script src="js/emotes.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
